<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" >
  <title>Projected View</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #root {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    canvas {
      position: absolute;
      inset: 0;
      z-index: 0;
      touch-action: none;
      width: 100%;
      height: 100%;
    }

    #ui_overlay_outer {
			position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
		}

		#ui_overlay_inner {
			padding: 0.25rem 1rem;
			line-height: 1.5rem;
		}

    button {
      position: absolute;
      top: 20px;
      right: 20px;
      pointer-events: auto;
    }

    .hidden {
			display: none;
		}
  </style>
</head>
<body>
  <div id="root">
    <canvas id="pv-canvas"></canvas>

    <!-- This becomes invisible once fullscreen is entered, press ESC to exit -->
    <div id="ui_overlay_outer">
      <div id="ui_overlay_inner">
        <button class="button" id="button_fullscreen">Enter Fullscreen</button>
      </div>
    </div>
    <!-- END: #ui_overlay -->

  </div> 
  <!-- END: #root -->

  <!-- Projected window has its own import map -->
  <script type="importmap">
    {
      "imports": {
        "three": "../../libs/threejs/three.module.min.js",
        "three/addons/": "../../libs/threejs/addons/"
      }
    }
  </script>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
