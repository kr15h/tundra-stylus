<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8' />
  <meta name='viewport' content='width=device-width, initial-scale=1' />
  <title>Projected View</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id='pv-canvas'></canvas>

  <!-- Projected window has its own import map -->
  <script type='importmap'>
    {
      "imports": {
        "three": "../../libs/threejs/three.module.min.js",
        "three/addons/": "../../libs/threejs/addons/"
      }
    }
  </script>

  <script type='module' src='./js/main.js'></script>
</body>
</html>
